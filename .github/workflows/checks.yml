name: Checks
on:
    workflow_dispatch:
    pull_request:
    push:
        branches:
            - "master"

jobs:
    tests:
        name: PHP ${{ matrix.php-version }}${{ matrix.thread-safety == 'zts' && ' ZTS' || '' }}, ${{ matrix.build }}${{ matrix.arch == 'arm64' && ', arm64' || '' }}
        runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
        container: php:${{ matrix.php-version }}-${{ matrix.thread-safety == 'zts' && 'zts' || 'cli' }}
        strategy:
            fail-fast: false
            matrix:
                php-version: [ '8.4', '8.5' ]
                build: [ turbocov, pcov ]
                arch: [ x86_64, arm64 ]
                thread-safety: [ nts, zts ]
                exclude:
                    -
                        build: pcov
                        arch: arm64
        steps:
            -
                name: Checkout code
                uses: actions/checkout@v6
            -
                # Two tests need these extensions as files. No ini file loads them.
                name: Install PCOV and Xdebug
                if: matrix.build == 'turbocov'
                run: pecl install pcov-1.0.12 xdebug-3.5.3 > /dev/null
            -
                # One test starts a second PHP thread with this extension.
                name: Install parallel
                if: matrix.build == 'turbocov' && matrix.thread-safety == 'zts'
                run: pecl install parallel-1.2.15 > /dev/null
            -
                name: Build and test
                run: dev/build-in-place.sh ${{ matrix.build }}

    clang:
        name: PHP ${{ matrix.php-version }} built with Clang${{ matrix.arch == 'arm64' && ', arm64' || '' }}
        runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
        container: debian:trixie
        strategy:
            fail-fast: false
            matrix:
                php-version: [ 8.4.27, 8.5.12 ]
                arch: [ x86_64, arm64 ]
                include:
                    -
                        php-version: 8.4.27
                        sha256: dcf93923b0e38e0d5252b25b796520b5a47761a08b3488b6d0b5d1115764d3f0
                    -
                        php-version: 8.5.12
                        sha256: 08bc2eba2a588654ade1357174aa646b761556c862dda0678345ee29ed481209
        env:
            CC: clang
        steps:
            -
                name: Install build tools
                run: |
                    apt-get update -qq
                    apt-get install -y -qq --no-install-recommends clang make autoconf libtool pkg-config ca-certificates curl xz-utils tar zstd > /dev/null
            -
                name: Checkout code
                uses: actions/checkout@v6
            -
                name: Cache PHP
                id: cache-php
                uses: actions/cache@v5
                with:
                    path: /opt/php
                    key: php-${{ matrix.php-version }}-${{ matrix.arch }}-clang-${{ hashFiles('dev/build-php.sh') }}
            -
                name: Build PHP
                if: steps.cache-php.outputs.cache-hit != 'true'
                run: dev/build-php.sh ${{ matrix.php-version }} ${{ matrix.sha256 }} /opt/php
            -
                name: Build and test
                run: |
                    export PATH="/opt/php/bin:$PATH"
                    clang --version
                    dev/build-in-place.sh turbocov
                env:
                    # PCOV and Xdebug are not in this PHP build
                    EXPECT_SKIPS: 2

    php-86:
        name: PHP 8.6 built with ${{ matrix.name }}
        runs-on: ubuntu-latest
        container: debian:trixie
        strategy:
            fail-fast: false
            matrix:
                include:
                    -
                        name: GCC
                        id: gcc
                        compiler: gcc
                        packages: gcc libc6-dev
                    -
                        name: Clang
                        id: clang
                        compiler: clang
                        packages: clang
                    -
                        name: GCC, debug build with AddressSanitizer
                        id: gcc-debug-asan
                        compiler: gcc
                        packages: gcc libc6-dev
                        configure: --enable-debug --enable-address-sanitizer
                        # PHP with AddressSanitizer has a different zend_arena. An extension must have the same define.
                        cflags: -fsanitize=address -fno-omit-frame-pointer -DZEND_TRACK_ARENA_ALLOC
                        ldflags: -fsanitize=address
        env:
            # The official images of PHP 8.6 are thread-safe builds, which turbocov does not support.
            # For a final release, change the version and the checksum, and remove PHP_URL.
            PHP_VERSION: 8.6.0RC7
            PHP_SHA256: 63dba3b693d2f2689f12d5264d212d7b813acfd56fb375c620d04e1eef4bb00a
            PHP_URL: https://downloads.php.net/~svpernova09/php-8.6.0RC7.tar.xz
            CC: ${{ matrix.compiler }}
            # turbocov does not free its tables at the end of the process. A later change does that.
            ASAN_OPTIONS: detect_leaks=0
        steps:
            -
                name: Install build tools
                run: |
                    apt-get update -qq
                    apt-get install -y -qq --no-install-recommends ${{ matrix.packages }} make autoconf libtool pkg-config ca-certificates curl xz-utils tar zstd > /dev/null
            -
                name: Checkout code
                uses: actions/checkout@v6
            -
                name: Cache PHP
                id: cache-php
                uses: actions/cache@v5
                with:
                    path: /opt/php
                    key: php-${{ env.PHP_VERSION }}-${{ matrix.id }}-${{ hashFiles('dev/build-php.sh') }}
            -
                name: Build PHP
                if: steps.cache-php.outputs.cache-hit != 'true'
                run: dev/build-php.sh "$PHP_VERSION" "$PHP_SHA256" /opt/php ${{ matrix.configure }}
            -
                name: Build and test
                run: |
                    export PATH="/opt/php/bin:$PATH"
                    $CC --version
                    php -v
                    php -r 'echo ZEND_VM_KIND, PHP_EOL;'
                    # PCOV and Xdebug are not in this PHP build
                    EXPECT_SKIPS=2 dev/build-in-place.sh turbocov
                    dev/build-in-place.sh pcov
                env:
                    CFLAGS: ${{ matrix.cflags }}
                    LDFLAGS: ${{ matrix.ldflags }}
            -
                # --asan turns the memory manager of PHP off, so AddressSanitizer sees each allocation.
                name: Test without the memory manager of PHP
                if: matrix.cflags
                run: |
                    export PATH="/opt/php/bin:$PATH"
                    EXPECT_SKIPS=2 dev/build-in-place.sh turbocov
                    dev/build-in-place.sh pcov
                env:
                    CFLAGS: ${{ matrix.cflags }}
                    LDFLAGS: ${{ matrix.ldflags }}
                    RUN_TESTS_FLAGS: --asan

    sanitizers:
        name: PHP ${{ matrix.php-version }} debug build with AddressSanitizer, ${{ matrix.build }}${{ matrix.arch == 'arm64' && ', arm64' || '' }}
        runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
        container: debian:trixie
        strategy:
            fail-fast: false
            matrix:
                build: [ turbocov, pcov ]
                arch: [ x86_64, arm64 ]
                exclude:
                    -
                        build: pcov
                        arch: arm64
                include:
                    -
                        php-version: 8.5.12
                        sha256: 08bc2eba2a588654ade1357174aa646b761556c862dda0678345ee29ed481209
        env:
            # Clang cannot build the tail-call VM of PHP 8.5 with AddressSanitizer.
            CC: gcc
        steps:
            -
                name: Install build tools
                run: |
                    apt-get update -qq
                    apt-get install -y -qq --no-install-recommends gcc libc6-dev make autoconf libtool pkg-config ca-certificates curl xz-utils tar zstd > /dev/null
            -
                name: Checkout code
                uses: actions/checkout@v6
            -
                name: Cache PHP
                id: cache-php
                uses: actions/cache@v5
                with:
                    path: /opt/php
                    key: php-${{ matrix.php-version }}-${{ matrix.arch }}-gcc-debug-asan-${{ hashFiles('dev/build-php.sh') }}
            -
                name: Build PHP
                if: steps.cache-php.outputs.cache-hit != 'true'
                run: dev/build-php.sh ${{ matrix.php-version }} ${{ matrix.sha256 }} /opt/php --enable-debug --enable-address-sanitizer
            -
                # The debug build of PHP reports the memory that the request did not free.
                name: Build and test
                run: |
                    export PATH="/opt/php/bin:$PATH"
                    dev/build-in-place.sh ${{ matrix.build }}
                env:
                    # PHP with AddressSanitizer has a different zend_arena. An extension must have the same define.
                    CFLAGS: -fsanitize=address -fno-omit-frame-pointer -DZEND_TRACK_ARENA_ALLOC
                    LDFLAGS: -fsanitize=address
                    # turbocov does not free its tables at the end of the process. A later change does that.
                    ASAN_OPTIONS: detect_leaks=0
                    # PCOV and Xdebug are not in this PHP build
                    EXPECT_SKIPS: ${{ matrix.build == 'turbocov' && '2' || '0' }}
            -
                # --asan turns the memory manager of PHP off, so AddressSanitizer sees each allocation.
                name: Test without the memory manager of PHP
                run: |
                    export PATH="/opt/php/bin:$PATH"
                    dev/build-in-place.sh ${{ matrix.build }}
                env:
                    # PHP with AddressSanitizer has a different zend_arena. An extension must have the same define.
                    CFLAGS: -fsanitize=address -fno-omit-frame-pointer -DZEND_TRACK_ARENA_ALLOC
                    LDFLAGS: -fsanitize=address
                    # turbocov does not free its tables at the end of the process. A later change does that.
                    ASAN_OPTIONS: detect_leaks=0
                    # PCOV and Xdebug are not in this PHP build
                    EXPECT_SKIPS: ${{ matrix.build == 'turbocov' && '2' || '0' }}
                    RUN_TESTS_FLAGS: --asan

    macos:
        name: PHP ${{ matrix.php-version }}, turbocov, macOS arm64
        runs-on: macos-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: [ '8.4', '8.5' ]
        steps:
            -
                name: Checkout code
                uses: actions/checkout@v6
            -
                # Two tests need PCOV and Xdebug as files. "coverage: none" removes them from the ini files.
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    extensions: pcov, xdebug
                    coverage: none
            -
                name: Build and test
                run: dev/build-in-place.sh turbocov

    macos-clang:
        name: PHP ${{ matrix.php-version }} built with Apple Clang, macOS arm64
        runs-on: macos-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    -
                        php-version: 8.5.12
                        sha256: 08bc2eba2a588654ade1357174aa646b761556c862dda0678345ee29ed481209
        steps:
            -
                # phpize needs autoconf, and the runner does not have it.
                name: Install build tools
                run: brew install --quiet autoconf
                env:
                    HOMEBREW_NO_AUTO_UPDATE: 1
            -
                name: Checkout code
                uses: actions/checkout@v6
            -
                name: Cache PHP
                id: cache-php
                uses: actions/cache@v5
                with:
                    path: ~/php
                    key: php-${{ matrix.php-version }}-macos-arm64-clang-${{ hashFiles('dev/build-php.sh') }}
            -
                name: Build PHP
                if: steps.cache-php.outputs.cache-hit != 'true'
                run: dev/build-php.sh ${{ matrix.php-version }} ${{ matrix.sha256 }} "$HOME/php"
            -
                name: Build and test
                run: |
                    export PATH="$HOME/php/bin:$PATH"
                    cc --version
                    dev/build-in-place.sh turbocov
                env:
                    # PCOV and Xdebug are not in this PHP build
                    EXPECT_SKIPS: 2
