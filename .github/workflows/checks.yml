name: Checks
on:
    workflow_dispatch:
    pull_request:
    push:
        branches:
            - "master"

jobs:
    tests:
        name: PHP ${{ matrix.php-version }}, ${{ matrix.build }}${{ matrix.arch == 'arm64' && ', arm64' || '' }}
        runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
        container: php:${{ matrix.php-version }}-cli
        strategy:
            fail-fast: false
            matrix:
                php-version: [ '8.4', '8.5' ]
                build: [ turbocov, pcov ]
                arch: [ x86_64, arm64 ]
                exclude:
                    -
                        build: pcov
                        arch: arm64
        steps:
            -
                name: Checkout code
                uses: actions/checkout@v6
            -
                # Two tests need these extensions as files. No ini file loads them.
                name: Install PCOV and Xdebug
                if: matrix.build == 'turbocov'
                run: pecl install pcov-1.0.12 xdebug-3.5.3 > /dev/null
            -
                name: Build and test
                run: dev/build-in-place.sh ${{ matrix.build }}

    clang:
        name: PHP ${{ matrix.php-version }} built with Clang${{ matrix.arch == 'arm64' && ', arm64' || '' }}
        runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
        container: debian:trixie
        strategy:
            fail-fast: false
            matrix:
                php-version: [ 8.4.27, 8.5.12 ]
                arch: [ x86_64, arm64 ]
                include:
                    -
                        php-version: 8.4.27
                        sha256: dcf93923b0e38e0d5252b25b796520b5a47761a08b3488b6d0b5d1115764d3f0
                    -
                        php-version: 8.5.12
                        sha256: 08bc2eba2a588654ade1357174aa646b761556c862dda0678345ee29ed481209
        env:
            CC: clang
        steps:
            -
                name: Install build tools
                run: |
                    apt-get update -qq
                    apt-get install -y -qq --no-install-recommends clang make autoconf libtool pkg-config ca-certificates curl xz-utils tar zstd > /dev/null
            -
                name: Checkout code
                uses: actions/checkout@v6
            -
                name: Cache PHP
                id: cache-php
                uses: actions/cache@v5
                with:
                    path: /opt/php
                    key: php-${{ matrix.php-version }}-${{ matrix.arch }}-clang-${{ hashFiles('dev/build-php.sh') }}
            -
                name: Build PHP
                if: steps.cache-php.outputs.cache-hit != 'true'
                run: dev/build-php.sh ${{ matrix.php-version }} ${{ matrix.sha256 }} /opt/php
            -
                name: Build and test
                run: |
                    export PATH="/opt/php/bin:$PATH"
                    clang --version
                    dev/build-in-place.sh turbocov
                env:
                    # PCOV and Xdebug are not in this PHP build
                    EXPECT_SKIPS: 2

    sanitizers:
        name: PHP ${{ matrix.php-version }} debug build with AddressSanitizer, ${{ matrix.build }}${{ matrix.arch == 'arm64' && ', arm64' || '' }}
        runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
        container: debian:trixie
        strategy:
            fail-fast: false
            matrix:
                build: [ turbocov, pcov ]
                arch: [ x86_64, arm64 ]
                exclude:
                    -
                        build: pcov
                        arch: arm64
                include:
                    -
                        php-version: 8.5.12
                        sha256: 08bc2eba2a588654ade1357174aa646b761556c862dda0678345ee29ed481209
        env:
            # Clang cannot build the tail-call VM of PHP 8.5 with AddressSanitizer.
            CC: gcc
        steps:
            -
                name: Install build tools
                run: |
                    apt-get update -qq
                    apt-get install -y -qq --no-install-recommends gcc libc6-dev make autoconf libtool pkg-config ca-certificates curl xz-utils tar zstd > /dev/null
            -
                name: Checkout code
                uses: actions/checkout@v6
            -
                name: Cache PHP
                id: cache-php
                uses: actions/cache@v5
                with:
                    path: /opt/php
                    key: php-${{ matrix.php-version }}-${{ matrix.arch }}-gcc-debug-asan-${{ hashFiles('dev/build-php.sh') }}
            -
                name: Build PHP
                if: steps.cache-php.outputs.cache-hit != 'true'
                run: dev/build-php.sh ${{ matrix.php-version }} ${{ matrix.sha256 }} /opt/php --enable-debug --enable-address-sanitizer
            -
                # The debug build of PHP reports the memory that the request did not free.
                name: Build and test
                run: |
                    export PATH="/opt/php/bin:$PATH"
                    dev/build-in-place.sh ${{ matrix.build }}
                env:
                    # PHP with AddressSanitizer has a different zend_arena. An extension must have the same define.
                    CFLAGS: -fsanitize=address -fno-omit-frame-pointer -DZEND_TRACK_ARENA_ALLOC
                    LDFLAGS: -fsanitize=address
                    # turbocov does not free its tables at the end of the process. A later change does that.
                    ASAN_OPTIONS: detect_leaks=0
                    # PCOV and Xdebug are not in this PHP build
                    EXPECT_SKIPS: ${{ matrix.build == 'turbocov' && '2' || '0' }}
            -
                # --asan turns the memory manager of PHP off, so AddressSanitizer sees each allocation.
                name: Test without the memory manager of PHP
                run: |
                    export PATH="/opt/php/bin:$PATH"
                    dev/build-in-place.sh ${{ matrix.build }}
                env:
                    # PHP with AddressSanitizer has a different zend_arena. An extension must have the same define.
                    CFLAGS: -fsanitize=address -fno-omit-frame-pointer -DZEND_TRACK_ARENA_ALLOC
                    LDFLAGS: -fsanitize=address
                    # turbocov does not free its tables at the end of the process. A later change does that.
                    ASAN_OPTIONS: detect_leaks=0
                    # PCOV and Xdebug are not in this PHP build
                    EXPECT_SKIPS: ${{ matrix.build == 'turbocov' && '2' || '0' }}
                    RUN_TESTS_FLAGS: --asan

    macos:
        name: PHP ${{ matrix.php-version }}, turbocov, macOS arm64
        runs-on: macos-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: [ '8.4', '8.5' ]
        steps:
            -
                name: Checkout code
                uses: actions/checkout@v6
            -
                # Two tests need PCOV and Xdebug as files. "coverage: none" removes them from the ini files.
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    extensions: pcov, xdebug
                    coverage: none
            -
                name: Diagnostics (temporary)
                run: |
                    sw_vers
                    which php php-config phpize
                    php --ini
                    php -m
                    php -i | grep -iE "^(Compiler|Architecture|Build System|Build Provider|Configure Command|opcache\.(enable|enable_cli|jit|jit_buffer_size|optimization_level|file_cache|preload|protect_memory)|Thread Safety|Debug Build)" || true
                    ls "$(php-config --extension-dir)"
                    php-config --configure-options | tr ' ' '\n' | grep -iE "^(CC|CFLAGS)|clang|gcc" || true
                    strings "$(php -r 'echo realpath(PHP_BINARY);')" | grep -iE "clang version|GCC: " | sort -u | head || true
                    cat /opt/homebrew/Cellar/php*/*/INSTALL_RECEIPT.json | grep -oE '"(compiler|built_on|poured_from_bottle|xcode|clt|os_version|arch)": *("[^"]*"|[a-z0-9.]+)' || true
                    php -i | grep -iE "pcre" || true
                    which pkg-config && pkg-config --cflags libpcre2-8 || true
                    cc --version
            -
                name: Build and test
                run: dev/build-in-place.sh turbocov
            -
                name: Collect with the ini files of the system (temporary)
                if: always()
                run: |
                    php -d extension="$PWD/modules/turbocov.so" -d turbocov.collect_paths="$PWD/tests/fixtures" -r '
                        turbocov\ensure_can_collect();
                        turbocov\start();
                        require "tests/fixtures/functions.php";
                        second(2);
                        var_dump(turbocov\stop(), turbocov\get_status());
                    '
