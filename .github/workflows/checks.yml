name: Checks
on:
    workflow_dispatch:
    pull_request:
    push:
        branches:
            - "master"

jobs:
    tests:
        name: PHP ${{ matrix.php-version }}, ${{ matrix.build }}
        runs-on: ubuntu-latest
        container: php:${{ matrix.php-version }}-cli
        strategy:
            fail-fast: false
            matrix:
                php-version: [ '8.4', '8.5' ]
                build: [ turbocov, pcov ]
        steps:
            -
                name: Checkout code
                uses: actions/checkout@v6
            -
                # Two tests need these extensions as files. No ini file loads them.
                name: Install PCOV and Xdebug
                if: matrix.build == 'turbocov'
                run: pecl install pcov-1.0.12 xdebug-3.5.3 > /dev/null
            -
                name: Build and test
                run: dev/build-in-place.sh ${{ matrix.build }}

    clang:
        name: PHP ${{ matrix.php-version }} built with Clang
        runs-on: ubuntu-latest
        container: debian:trixie
        strategy:
            fail-fast: false
            matrix:
                include:
                    -
                        php-version: 8.4.27
                        sha256: dcf93923b0e38e0d5252b25b796520b5a47761a08b3488b6d0b5d1115764d3f0
                    -
                        php-version: 8.5.12
                        sha256: 08bc2eba2a588654ade1357174aa646b761556c862dda0678345ee29ed481209
        env:
            CC: clang
        steps:
            -
                name: Install build tools
                run: |
                    apt-get update -qq
                    apt-get install -y -qq --no-install-recommends clang make autoconf libtool pkg-config ca-certificates curl xz-utils tar zstd > /dev/null
            -
                name: Checkout code
                uses: actions/checkout@v6
            -
                name: Cache PHP
                id: cache-php
                uses: actions/cache@v5
                with:
                    path: /opt/php
                    key: php-${{ matrix.php-version }}-clang-${{ hashFiles('dev/build-php.sh') }}
            -
                name: Build PHP
                if: steps.cache-php.outputs.cache-hit != 'true'
                run: dev/build-php.sh ${{ matrix.php-version }} ${{ matrix.sha256 }} /opt/php
            -
                name: Build and test
                run: |
                    export PATH="/opt/php/bin:$PATH"
                    clang --version
                    php -v
                    dev/build-in-place.sh turbocov
                env:
                    # PCOV and Xdebug are not in this PHP build
                    EXPECT_SKIPS: 2

    sanitizers:
        name: PHP ${{ matrix.php-version }} debug build with AddressSanitizer, ${{ matrix.build }}
        runs-on: ubuntu-latest
        container: debian:trixie
        strategy:
            fail-fast: false
            matrix:
                build: [ turbocov, pcov ]
                include:
                    -
                        php-version: 8.5.12
                        sha256: 08bc2eba2a588654ade1357174aa646b761556c862dda0678345ee29ed481209
        env:
            # Clang cannot build the tail-call VM of PHP 8.5 with AddressSanitizer.
            CC: gcc
        steps:
            -
                name: Install build tools
                run: |
                    apt-get update -qq
                    apt-get install -y -qq --no-install-recommends gcc libc6-dev make autoconf libtool pkg-config ca-certificates curl xz-utils tar zstd > /dev/null
            -
                name: Checkout code
                uses: actions/checkout@v6
            -
                name: Cache PHP
                id: cache-php
                uses: actions/cache@v5
                with:
                    path: /opt/php
                    key: php-${{ matrix.php-version }}-gcc-debug-asan-${{ hashFiles('dev/build-php.sh') }}
            -
                name: Build PHP
                if: steps.cache-php.outputs.cache-hit != 'true'
                run: dev/build-php.sh ${{ matrix.php-version }} ${{ matrix.sha256 }} /opt/php --enable-debug --enable-address-sanitizer
            -
                # The debug build of PHP reports the memory that the request did not free.
                name: Build and test
                run: |
                    export PATH="/opt/php/bin:$PATH"
                    php -v
                    dev/build-in-place.sh ${{ matrix.build }}
                env:
                    # PHP with AddressSanitizer has a different zend_arena. An extension must have the same define.
                    CFLAGS: -fsanitize=address -fno-omit-frame-pointer -DZEND_TRACK_ARENA_ALLOC
                    LDFLAGS: -fsanitize=address
                    # turbocov does not free its tables at the end of the process. A later change does that.
                    ASAN_OPTIONS: detect_leaks=0
                    # PCOV and Xdebug are not in this PHP build
                    EXPECT_SKIPS: ${{ matrix.build == 'turbocov' && '2' || '0' }}
            -
                # --asan turns the memory manager of PHP off, so AddressSanitizer sees each allocation.
                name: Test without the memory manager of PHP
                run: |
                    export PATH="/opt/php/bin:$PATH"
                    dev/build-in-place.sh ${{ matrix.build }}
                env:
                    # PHP with AddressSanitizer has a different zend_arena. An extension must have the same define.
                    CFLAGS: -fsanitize=address -fno-omit-frame-pointer -DZEND_TRACK_ARENA_ALLOC
                    LDFLAGS: -fsanitize=address
                    # turbocov does not free its tables at the end of the process. A later change does that.
                    ASAN_OPTIONS: detect_leaks=0
                    # PCOV and Xdebug are not in this PHP build
                    EXPECT_SKIPS: ${{ matrix.build == 'turbocov' && '2' || '0' }}
                    RUN_TESTS_FLAGS: --asan
